# =============================================================================
# IPsec / IKEv2 Configuration — London Gateway (VM4)
# =============================================================================
# Site-to-site tunnel between London and Stockholm using x509 certificates
# signed by the ACME CA (VM3).
#
# WAN link: VM4 10.100.0.2/30 <── acme-wan ──> 10.100.0.1/30 VM1
# =============================================================================

config setup
    charondebug="ike 2, knl 2, cfg 2, net 2, esp 2, dmn 2, mgr 2"
    uniqueids=yes

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
    authby=pubkey

conn london-stockholm
    # ── Local (London) ──
    left=10.100.0.2
    leftsubnet=10.0.2.0/26,10.0.2.128/26
    leftcert=london.crt
    leftid=@london.acme.corp
    leftsendcert=always

    # ── Remote (Stockholm) ──
    right=10.100.0.1
    rightsubnet=10.0.1.0/26,10.0.1.128/26,10.0.1.240/28
    rightid=@stockholm.acme.corp
    rightca="CN=ACME-CA"

    # ── Tunnel behaviour ──
    auto=add
    type=tunnel
