# =============================================================================
# IPsec / IKEv2 Configuration — London Gateway
# =============================================================================
# Site-to-site tunnel between London and Stockholm using x509 certificates
# signed by the ACME CA (VM3).
#
# INSTRUCTIONS:
#   1. Install StrongSwan:
#        sudo apt install strongswan strongswan-pki libcharon-extra-plugins
#   2. Copy certificates:
#        sudo cp ca.crt      /etc/ipsec.d/cacerts/
#        sudo cp london.crt  /etc/ipsec.d/certs/
#        sudo cp london.key  /etc/ipsec.d/private/
#        sudo chmod 600 /etc/ipsec.d/private/london.key
#   3. Copy this file to /etc/ipsec.conf
#   4. Copy ipsec.secrets to /etc/ipsec.secrets
#   5. Update 'right=' below with Stockholm router's IP on the shared LAN
#   6. Enable IP forwarding:
#        echo "net.ipv4.ip_forward=1" | sudo tee /etc/sysctl.d/99-forward.conf
#        sudo sysctl -p /etc/sysctl.d/99-forward.conf
#   7. Start StrongSwan:
#        sudo systemctl enable --now strongswan-starter
#        sudo ipsec restart
# =============================================================================

config setup
    charondebug="ike 2, knl 2, cfg 2, net 2, esp 2, dmn 2, mgr 2"
    uniqueids=yes

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
    authby=pubkey

conn london-stockholm
    # ── Local (London) ──
    left=%defaultroute
    leftsubnet=10.0.1.128/26
    leftcert=london.crt
    leftid=@london.acme.corp
    leftsendcert=always

    # ── Remote (Stockholm) ──
    # TODO: Replace with Stockholm router's IP on the shared LAN
    right=%any
    rightsubnet=10.0.1.0/26,10.0.1.240/28
    rightid=@stockholm.acme.corp
    rightca="CN=ACME-CA"

    # ── Tunnel behaviour ──
    auto=start
    type=tunnel
